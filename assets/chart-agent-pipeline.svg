<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect width="960" height="400" fill="#0d1117" rx="10"/>
<text x="32" y="44" fill="#e6edf3" font-size="21" font-weight="700">Chart Agent · 端侧图表生成原型（实习期项目）</text>
<text x="32" y="68" fill="#8b949e" font-size="13">PDF 图题提取 → CSV 语义匹配 → 自动出图｜已打包交付内部使用</text>
<line x1="32" y1="84" x2="928" y2="84" stroke="#30363d" stroke-width="1"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d"/></marker></defs>
<rect x="32" y="108" width="210" height="88" rx="8" fill="#161b22" stroke="#6366f1" stroke-width="1.5"/>
<text x="137.0" y="131" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">PDF 图题提取</text>
<text x="137.0" y="150" fill="#8b949e" font-size="11" text-anchor="middle">解析文档中的图表需求</text>
<text x="137.0" y="165" fill="#8b949e" font-size="11" text-anchor="middle">结构化为出图任务</text>
<rect x="268" y="108" width="210" height="88" rx="8" fill="#161b22" stroke="#6366f1" stroke-width="1.5"/>
<text x="373.0" y="131" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">CSV 语义匹配</text>
<text x="373.0" y="150" fill="#8b949e" font-size="11" text-anchor="middle">把任务对到实际数据列</text>
<text x="373.0" y="165" fill="#8b949e" font-size="11" text-anchor="middle">列名/单位歧义消解</text>
<rect x="504" y="108" width="210" height="88" rx="8" fill="#161b22" stroke="#6366f1" stroke-width="1.5"/>
<text x="609.0" y="131" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">自动出图</text>
<text x="609.0" y="150" fill="#8b949e" font-size="11" text-anchor="middle">Matplotlib 渲染</text>
<text x="609.0" y="165" fill="#8b949e" font-size="11" text-anchor="middle">样式模板统一</text>
<rect x="740" y="108" width="188" height="88" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
<text x="834.0" y="131" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">审计清单</text>
<text x="834.0" y="150" fill="#8b949e" font-size="11" text-anchor="middle">每步产物可核对</text>
<text x="834.0" y="165" fill="#8b949e" font-size="11" text-anchor="middle">问题可回溯定位</text>
<line x1="242" y1="152" x2="266" y2="152" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="478" y1="152" x2="502" y2="152" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="714" y1="152" x2="738" y2="152" stroke="#30363d" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="32" y="232" width="446" height="84" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
<text x="255.0" y="255" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">SQLite 记忆系统</text>
<text x="255.0" y="274" fill="#8b949e" font-size="11" text-anchor="middle">复用历史匹配结果与样式选择，减少重复人工确认</text>
<rect x="504" y="232" width="424" height="84" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="716.0" y="255" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">对外披露边界</text>
<text x="716.0" y="274" fill="#8b949e" font-size="11" text-anchor="middle">不含真实波形数据 / 客户代号 / 内部路径</text>
<text x="716.0" y="289" fill="#8b949e" font-size="11" text-anchor="middle">无公开仓库链接，面试可讲结构不讲数据</text>
<text x="32" y="384" fill="#8b949e" font-size="10.5">实习期间非公开项目，面试时可进一步介绍。</text>
</svg>